name: Development checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export --platform android --output-dir .expo/ci-android
      - run: npx expo export --platform web --output-dir .expo/ci-web
      - run: npm run check:emulators
      # SDK-drift checks run last: every Expo SDK patch release makes them fail
      # with no code change, and as early steps they hid every check after them.
      # They still fail the job; `!cancelled()` makes them report even when a
      # functional check above already failed.
      - name: Expo dependency versions
        if: ${{ !cancelled() }}
        run: npx expo install --check
      - name: Expo doctor
        if: ${{ !cancelled() }}
        run: npx --yes expo-doctor@latest
      - name: Report dependency advisories
        run: npm audit
        continue-on-error: true
